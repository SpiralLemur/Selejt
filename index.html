<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BWZ Selejtbejelentő V2</title><style>:root{--b:#0b5cab;--bg:#f4f6f8;--g:#067647;--r:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Arial;color:#17202a}header{background:var(--b);color:white;padding:18px;position:sticky;top:0}header h1{margin:0;font-size:21px}header p{margin:4px 0 0;font-size:13px}main{max-width:760px;margin:auto;padding:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab,button{border:0;border-radius:11px;padding:12px;font-weight:800}.tab{background:#e4e7ec}.tab.on,.primary{background:var(--b);color:white}.card{background:white;border:1px solid #e4e7ec;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 2px 10px #10182812}label{display:block;font-weight:750;font-size:14px;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid #cfd4dc;border-radius:10px;padding:12px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shift{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.shift input{display:none}.shift span{display:block;text-align:center;border:1px solid #cfd4dc;border-radius:10px;padding:12px;font-weight:800}.shift input:checked+span{color:var(--b);background:#eaf3fb;border:2px solid var(--b);padding:11px}.primary,.secondary,.success,.danger{width:100%;margin-top:13px}.secondary{background:#e4e7ec}.success{background:#d1fadf;color:var(--g)}.danger{background:#fee4e2;color:var(--r)}.hint,.meta{color:#667085;font-size:12px;margin-top:5px}.msg{font-weight:750;margin-top:10px}.item{border:1px solid #e4e7ec;border-radius:12px;padding:11px;margin-top:10px}.top{display:flex;justify-content:space-between;gap:10px}.qty{font-size:20px;color:var(--b);font-weight:900}.actions{display:flex;gap:8px;margin-top:8px}.actions button{padding:7px 10px}.summary{display:flex;justify-content:space-between;background:#eaf3fb;border-radius:11px;padding:12px;margin-top:12px}.hidden{display:none!important}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e4e7ec;padding:8px 5px}.warn{background:#fffaeb}.zero{color:var(--g);font-weight:800}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><header><h1>BWZ Selejtbejelentő</h1><p>Mobilos mintaalkalmazás • V2</p></header><main><div class="tabs"><button class="tab on" data-v="worker">Dolgozói felület</button><button class="tab" data-v="admin">Irodai lista</button></div><section id="worker"><div class="card"><h2>Új tétel rögzítése</h2><label for="name">Kitöltő neve</label><input id="name" type="text" autocomplete="name" maxlength="80" placeholder="Írd be a teljes neved"><label for="date">Dátum</label><input id="date" type="date"><label>Műszak</label><div class="shift"><label><input type="radio" name="shift" value="DE"><span>DE</span></label><label><input type="radio" name="shift" value="DU"><span>DU</span></label><label><input type="radio" name="shift" value="É"><span>É</span></label></div><label for="part">Cikkszám és megnevezés</label><select id="part"><option value="">Válassz a listából…</option></select><label for="qty">Selejt darabszám</label><input id="qty" type="number" min="1" step="1" inputmode="numeric" placeholder="Írd be a darabszámot"><label for="note">Megjegyzés (opcionális)</label><textarea id="note" rows="2"></textarea><button id="save" class="primary">Tétel mentése</button><div id="msg" class="msg"></div></div><div class="card"><h2>Kiválasztott műszak tételei</h2><div id="items"></div><div id="total" class="summary hidden"><span>Összes selejt</span><b>0 db</b></div><button id="zero" class="success">Nem keletkezett selejt</button><button id="close" class="secondary">Műszak lezárása</button></div></section><section id="admin" class="hidden"><div class="card warn"><b>Fontos:</b> ez a V2 helyi prototípus. Az adatok még csak az adott készülék böngészőjében tárolódnak.</div><div class="card"><h2>Beérkezett tételek</h2><div class="row"><div><label for="fd">Dátum</label><input id="fd" type="date"></div><div><label for="fs">Műszak</label><select id="fs"><option value="">Mind</option><option>DE</option><option>DU</option><option>É</option></select></div></div><div class="scroll"><table><thead><tr><th>Dátum</th><th>Műszak</th><th>Kitöltő</th><th>Cikkszám / megnevezés</th><th>Db</th><th>Megjegyzés</th></tr></thead><tbody id="rows"></tbody></table></div><button id="export" class="primary">CSV export Excelhez</button><button id="clear" class="danger">Helyi adatok törlése</button></div></section></main><script>
const parts=[['7C2.012.113.C','Szerszámosláda'],['7C2.012.113.D','Szerszámosláda'],['7C0.012.113.E','Szerszámosláda'],['7C0.012.113.D','Szerszámosláda'],['7C0.012.113.F','Szerszámosláda'],['6X0.012.243','Kupakleszedő kampó'],['7C0.012.289','Csavarhúzó betét'],['1J0.012.255','Csavarhúzó'],['4H0.805.615.A','Vonószem'],['7C0.012.218','Kerékkulcs kereszt'],['2N0.011.273','Emelőkar'],['8T0.012.259','Lámpaleszedő'],['7C0.012.163.B','Hosszabbító'],['8Z0.012.255','Csavarhúzó'],['6R0.012.289','Csavarhúzó betét'],['8V3 012 635 A','Tartószalag'],['2K4 012 120 A','Szerszámosláda új'],['2K4 012 120','Szerszámosláda új'],['2K7.012.113.L','Szerszámosláda új'],['2K7.012.113.D','Szerszámosláda'],['2K7.012.113.H','Szerszámosláda']];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],key='bwz_v2';let data=JSON.parse(localStorage.getItem(key)||'[]'),editing=null;$('#date').value=new Date().toISOString().slice(0,10);parts.forEach(x=>$('#part').add(new Option(x[0]+' — '+x[1],x[0])));function sh(){return $('input[name=shift]:checked')?.value||''}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tell(t,ok=false){$('#msg').style.color=ok?'#067647':'#b42318';$('#msg').textContent=t;setTimeout(()=>$('#msg').textContent='',2600)}function persist(){localStorage.setItem(key,JSON.stringify(data));render()}function current(){return data.filter(x=>x.date===$('#date').value&&x.shift===sh())}function save(){let name=$('#name').value.trim(),date=$('#date').value,shift=sh(),part=$('#part').value,qty=Number($('#qty').value),note=$('#note').value.trim();if(!name||!date||!shift||!part||!Number.isInteger(qty)||qty<1)return tell('A kitöltő neve, dátum, műszak, cikkszám és pozitív egész darabszám kötelező.');let desc=parts.find(x=>x[0]===part)[1],rec={id:editing||Date.now(),name,date,shift,part,desc,qty,note,status:'nyitott',created:new Date().toISOString()};if(editing){data=data.map(x=>x.id===editing?rec:x);editing=null;$('#save').textContent='Tétel mentése'}else data.push(rec);$('#part').value='';$('#qty').value='';$('#note').value='';persist();tell('A tétel mentve.',true)}function render(){let a=current();$('#items').innerHTML=a.length?a.map(x=>x.zero?`<div class="item zero">✓ Nem keletkezett selejt • Kitöltő: ${esc(x.name)}</div>`:`<div class="item"><div class="top"><div><b>${esc(x.part)}</b><br>${esc(x.desc)}<div class="meta">${esc(x.date)} • ${esc(x.shift)} • Kitöltő: ${esc(x.name)}${x.note?' • '+esc(x.note):''}</div></div><div class="qty">${x.qty} db</div></div><div class="actions"><button onclick="editItem(${x.id})">Szerkesztés</button><button onclick="delItem(${x.id})">Törlés</button></div></div>`).join(''):'<p class="hint">A mentett tételek itt jelennek meg.</p>';$('#total').classList.toggle('hidden',!a.length);$('#total b').textContent=a.reduce((s,x)=>s+(x.qty||0),0)+' db';admin()}window.editItem=id=>{let x=data.find(y=>y.id===id);if(!x||x.zero)return;$('#name').value=x.name;$('#date').value=x.date;$$('input[name=shift]').forEach(r=>r.checked=r.value===x.shift);$('#part').value=x.part;$('#qty').value=x.qty;$('#note').value=x.note;editing=id;$('#save').textContent='Módosítás mentése';scrollTo({top:0,behavior:'smooth'});render()};window.delItem=id=>{if(confirm('Törlöd a tételt?')){data=data.filter(x=>x.id!==id);persist()}};function zero(){let name=$('#name').value.trim(),date=$('#date').value,shift=sh();if(!name||!date||!shift)return tell('Írd be a kitöltő nevét, és válassz dátumot, műszakot.');if(current().some(x=>!x.zero))return tell('Ehhez a műszakhoz már van selejttétel.');if(!current().length){data.push({id:Date.now(),name,date,shift,zero:true,qty:0,status:'lezárt',created:new Date().toISOString()});persist();tell('Selejtmentes műszak rögzítve.',true)}}function closeShift(){let a=current();if(!a.length)return tell('Nincs rögzített tétel.');if(confirm('Biztosan lezárod a műszakot?')){let ids=new Set(a.map(x=>x.id));data=data.map(x=>ids.has(x.id)?{...x,status:'lezárt',closedAt:new Date().toISOString()}:x);persist();tell('A műszak lezárva.',true)}}function admin(){let fd=$('#fd').value,fs=$('#fs').value,a=data.filter(x=>(!fd||x.date===fd)&&(!fs||x.shift===fs));$('#rows').innerHTML=a.length?a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.shift)}</td><td>${esc(x.name)}</td><td>${x.zero?'<span class="zero">Nem volt selejt</span>':`<b>${esc(x.part)}</b><br>${esc(x.desc)}`}</td><td>${x.qty||0}</td><td>${esc(x.note||'')}</td></tr>`).join(''):'<tr><td colspan="6">Nincs adat.</td></tr>'}function exportCSV(){let rows=[['Dátum','Műszak','Kitöltő neve','Cikkszám','Megnevezés','Darabszám','Megjegyzés','Státusz'],...data.map(x=>[x.date,x.shift,x.name,x.zero?'':x.part,x.zero?'Nem volt selejt':x.desc,x.qty||0,x.note||'',x.status])],csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('
'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='BWZ_selejt_V2_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)}$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#worker').classList.toggle('hidden',b.dataset.v!=='worker');$('#admin').classList.toggle('hidden',b.dataset.v!=='admin');admin()});$('#save').onclick=save;$('#zero').onclick=zero;$('#close').onclick=closeShift;$('#export').onclick=exportCSV;$('#clear').onclick=()=>{if(confirm('Törlöd az összes helyi adatot?')){data=[];persist()}};$('#fd').oninput=admin;$('#fs').onchange=admin;$('#date').onchange=render;$$('input[name=shift]').forEach(x=>x.onchange=render);render();
</script></body></html>
